name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A13859: ${{ secrets.A13859 }}
          B02A8C: ${{ secrets.B02A8C }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A13859', '')
          sec_b = os.environ.get('B02A8C', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- aa99f689e0e0b068b60096d32eea6613e699a1889632de -->', sec_a)
          if sec_b:
              after = after.replace('<!-- c447ab59ef5673259582a34cf63ae396d43850396da125 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
